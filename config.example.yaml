# adpack configuration file
# Copy this to ~/.adpack/config.yaml and customize as needed
# A default config is generated by setup.sh; this file documents all options.

# SOCKS5 proxy address for routing traffic through a C2 implant
# Example: "127.0.0.1:1080" for a Sliver/Metasploit SOCKS5 tunnel
# When set, all NetExec operations are wrapped in proxychains4
# Requires proxychains4 to be installed and configured
# Can also be set via the ADPACK_PROXY environment variable
proxy_address: ""

# Database path for state persistence.
# Empty string = default path (~/.adpack/state.db).
db_path: ""

# Default nmap arguments for the discovery phase.
# Use -sn for ping-only discovery, or omit for full port scan.
nmap_args: ["-T4", "-sn"]

# Path to netexec/nxc binary. Searches PATH if not specified.
nxc_path: "netexec"

# Path to bloodhound-python binary. Searches PATH if not specified.
bh_python: "bloodhound-python"

# Hashcat cracking pipeline configuration.
# Extracted hashes (NTLM, krb5tgs, krb5asrep) are automatically
# enqueued and cracked in the background.
cracking:
  # Path to hashcat binary
  hashcat_path: "/usr/bin/hashcat"
  # Path to wordlist for cracking
  wordlist: "/usr/share/wordlists/rockyou.txt"
  # Hashcat rule files applied during cracking
  rules: ["/usr/share/hashcat/rules/best64.rule"]
  # Timeout in seconds per hash attempt.
  # If hashcat exceeds this, the job is abandoned.
  timeout_seconds: 600

# Target scope: CIDR ranges allowed for attacks.
# When set, adpack will refuse to target hosts outside these ranges.
# This is a safety net to prevent accidental targeting of production
# IPs during assessments.
# scope:
#   - "10.0.0.0/8"
#   - "192.168.1.0/24"

# Target domain (used by adpack init / autorun)
# Example: "corp.local"
domain: ""

# Default evasion profile (native|pplshade|phantomkiller)
profile: "native"

# Seed credentials for bootstrapping the attack chain.
# These are used as the initial authentication material.
# seeds:
#   - domain: "corp.local"
#     user: "jsmith"
#     password: "Password1"
#     hash: ""

# Timing controls for operational security
# These add random delays between operations to avoid detection patterns.
timing:
  # Base delay in milliseconds between each transport operation
  delay_ms: 0
  # Random jitter fraction (0.0-1.0) added to delay
  # Example: delay_ms=1000, jitter=0.5 → 500-1500ms per operation
  jitter: 0.0
  # Maximum concurrent operations (10 = no meaningful limit)
  max_concurrent: 10

# BloodHound Neo4j / Viper C2 configuration (optional).
# Required for Cypher queries via `adpack query`.
viper:
  # Enable Neo4j connection
  enabled: false
  # Neo4j bolt host
  host: "localhost"
  # Neo4j bolt port
  port: 7687
  # Neo4j username
  username: ""
  # Neo4j password
  password: ""
  # Enable TLS for Neo4j connection
  tls: false
